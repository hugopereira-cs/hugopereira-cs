name: Update Language Stats

on:
  schedule:
    - cron: "0 */12 * * *"   # Roda a cada 12 horas
  workflow_dispatch:          # Permite rodar manualmente pelo GitHub

permissions:
  contents: write             # Necessário para commitar o SVG gerado

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Gerar SVG de estatísticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate_stats.py

      - name: Commitar e enviar SVG atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/top-langs.svg
          git diff --staged --quiet || git commit -m "chore: atualizar estatísticas de linguagens [skip ci]"
          git push
